name: Docker

# Every push to main builds the hub image "latest", with the Android app inside.
# Releases come from tags, see release.yml.
on:
  push:
    branches: [main]
    paths:
      - hub/**
      - android/**
      - .github/workflows/docker.yml
      - .github/actions/**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name the version
        id: version
        run: echo "name=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/android-app
        with:
          keystore-b64: ${{ secrets.DOORBELL_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.DOORBELL_KEYSTORE_PASSWORD }}
          version-name: ${{ steps.version.outputs.name }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: hub
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/doorbell-hub:latest
