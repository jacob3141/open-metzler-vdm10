name: Docker

on:
  push:
    branches: [main]
    paths:
      - hub/**
      - android/**
      - .github/workflows/docker.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The hub hands out the Android app; every build counts the version up, so a phone
      # takes it as an update. The release key is a secret, the same for every build.
      - name: Build the Android app
        working-directory: android
        env:
          DOORBELL_KEYSTORE: ${{ runner.temp }}/doorbell-release.jks
          DOORBELL_KEYSTORE_PASSWORD: ${{ secrets.DOORBELL_KEYSTORE_PASSWORD }}
          DOORBELL_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "${{ secrets.DOORBELL_KEYSTORE_B64 }}" | base64 -d > "$DOORBELL_KEYSTORE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../hub/app/doorbell.apk
          rm "$DOORBELL_KEYSTORE"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: hub
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/doorbell-hub:latest
