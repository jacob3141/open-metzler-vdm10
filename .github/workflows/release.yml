name: Release

# Push a tag like v0.2.0 to release that commit:
#   git tag v0.2.0 && git push origin v0.2.0
# The release gets the signed Android app and doorbelld for the door station, and the hub
# image is pushed as ghcr.io/<owner>/doorbell-hub:0.2.0 and :latest.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name the version
        id: version
        run: echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # doorbelld must stay small enough for the flash, which needs Go 1.26 (see README).
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/doorbelld/go.mod
          cache-dependency-path: |
            hub/go.sum
            device/doorbelld/go.mod

      - name: Test the hub and doorbelld
        run: |
          (cd hub && go test ./...)
          (cd device/doorbelld && go test ./...)

      - uses: ./.github/actions/android-app
        with:
          keystore-b64: ${{ secrets.DOORBELL_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.DOORBELL_KEYSTORE_PASSWORD }}
          version-name: ${{ steps.version.outputs.name }}

      - name: Build doorbelld
        working-directory: device/doorbelld
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '5'
        run: go build -buildvcs=false -trimpath -gcflags=all=-l -ldflags='-s -w' -o doorbelld .

      - name: Collect the files
        run: |
          mkdir dist
          cp hub/app/doorbell.apk "dist/doorbell-$TAG.apk"
          cp device/doorbelld/doorbelld "dist/doorbelld-$TAG-linux-armv5"
          cd dist && sha256sum * > SHA256SUMS

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: hub
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doorbell-hub:${{ steps.version.outputs.name }}
            ghcr.io/${{ github.repository_owner }}/doorbell-hub:latest

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Hub image: \`ghcr.io/${{ github.repository_owner }}/doorbell-hub:${{ steps.version.outputs.name }}\`

          - \`doorbell-$TAG.apk\`: Android app, signed with the release key; installs over every earlier version from the hub or a release.
          - \`doorbelld-$TAG-linux-armv5\`: WebSocket server for the door station, see "Deploying doorbelld and mediad" in the README.

          \`mediad\` is not included: it links against libraries of the door station that are not in this repository.
          NOTES
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
